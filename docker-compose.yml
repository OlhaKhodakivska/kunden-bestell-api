services:
  postgres:
    image: postgres:17-alpine
    container_name: kunden-bestell-postgres
    environment:
      POSTGRES_DB: kunden_bestell_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kunden_bestell_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: